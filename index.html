/* ============================ 常量 ============================ */
var TIERS = 11;
var RADII = [16,23,30,37,46,54,65,75,88,102,122];
var NAMES = ["猫猫美玲","迷彩美玲","夜行美玲","电梯美玲","刷题美玲","乖巧美玲",
             "嘟嘴美玲","自习美玲","军训美玲","比耶美玲","姚美玲本玲"];
var COLORS = ["#FF6B9D","#FF8A5B","#FFC13B","#A8E063","#4FC3A1",
              "#4FA8E0","#7B7BE0","#B06BE0","#E05B9C","#FF5C5C","#FFD257"];
var PTS = [0,1,3,6,10,15,21,28,36,45,66];
var SPAWN_W = [30,26,20,14,10];

var FIELD_W = 420, FIELD_H = 700, HELD_Y = -50, DEATH_Y = 70, TOP_PAD = 108;
var GRAVITY=1750, MAXV=3000, SUBSTEPS=6, ITER=3, REST=0.10, WALL_REST=0.06,
    WALL_FRIC=0.90, AIR=0.9992;
var DROP_DELAY=0.34, DANGER_LIMIT=1.7, CELEBRATE=2.6;

var INK="#3A3250", INK2="#8A80A6", PINK="#E94A80", GOLD="#D69826";

/* ============================ 画布 ============================ */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d', {alpha:false});
var W=0,H=0,DPR=1;
var L={};

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  computeLayout();
}

function computeLayout(){
  var virtH = TOP_PAD + FIELD_H;
  var portrait = (W <= H*1.12);
  L.portrait = portrait;
  if (portrait){
    L.hudH = H*0.135;
    L.stripH = H*0.058;
    var availW = W*0.92;
    var availH = H - L.hudH - L.stripH - H*0.015;
    L.s = Math.min(availW/FIELD_W, availH/virtH);
    L.fw = FIELD_W*L.s; L.fh = FIELD_H*L.s;
    L.fl = (W - L.fw)/2;
    L.ft = L.hudH + (availH - virtH*L.s)/2 + TOP_PAD*L.s;
    L.panel = null;
  } else {
    var pad = Math.max(10, H*0.045);
    L.s = (H - pad*2)/virtH;
    L.fw = FIELD_W*L.s; L.fh = FIELD_H*L.s;
    var pw  = Math.min(Math.max(190, W*0.28), 330);   /* 侧栏封顶，别喧宾夺主 */
    var gap = Math.max(14, W*0.022);
    var total = L.fw + gap + pw;
    L.fl = Math.max(pad, (W - total)/2);              /* 整体居中 */
    L.ft = pad + TOP_PAD*L.s;
    L.panel = {x: L.fl + L.fw + gap, y: pad, w: pw, h: H - pad*2};
    L.hudH = pad; L.stripH = 0;
  }
}

function sx(v){ return L.fl + v*L.s; }
function sy(v){ return L.ft + v*L.s; }
function sd(v){ return v*L.s; }

/* ============================ 图像 ============================ */
var sprites = [];
var loaded = 0;
for (var i=0;i<TIERS;i++){
  (function(k){
    var im = new Image();
    im.onload = function(){ loaded++; };
    im.src = SPRITE_SRC[k];
    sprites[k] = im;
  })(i);
}

/* ============================ 音效 ============================ */
var sndPool = [], sndIdx = 0, audioReady = false, lastSnd = 0;

function initAudio(){
  if (audioReady) return;
  audioReady = true;
  for (var i=0;i<4;i++){
    var a = new Audio();
    a.src = SND_SRC;
    a.preload = 'auto';
    a.setAttribute('playsinline','');
    try { a.load(); } catch(e){}
    sndPool.push(a);
  }
  try {
    var u = sndPool[0];
    u.volume = 0;
    var p = u.play();
    if (p && p.then) p.then(function(){ u.pause(); u.currentTime=0; u.volume=1; })
                       .catch(function(){ u.volume = 1; });
    else u.volume = 1;
  } catch(e){}
}

function playBao(rate){
  if (!audioReady || !sndPool.length) return;
  var a = sndPool[sndIdx = (sndIdx+1) % sndPool.length];
  try {
    a.pause();
    a.currentTime = 0;
    a.volume = 1;
    if ('playbackRate' in a) a.playbackRate = rate;
    var p = a.play();
    if (p && p.catch) p.catch(function(){});
  } catch(e){}
}

function onMergeSound(tier){
  var now = (window.performance && performance.now) ? performance.now() : Date.now();
  if (now - lastSnd < 130) return;      /* 连击限流，避免糊成一片 */
  lastSnd = now;
  playBao(tier >= 8 ? 0.86 : (tier >= 5 ? 1.0 : 1.15));
}

/* ============================ 物理世界 ============================ */
var balls=[], fx=[], score=0, best=0, held=-1, nextT=0, heldX=0, cooldown=0;
var overTimer=0, gameOver=false, paused=false, bannerT=0, bestTier=0, started=false;
var aimX = null;

function loadBest(){
  try { best = parseInt(localStorage.getItem('ymm_best')||'0',10)||0; } catch(e){ best=0; }
}
function saveBest(){ try { localStorage.setItem('ymm_best', String(best)); } catch(e){} }

function pick(){
  var tot=0, i;
  for (i=0;i<SPAWN_W.length;i++) tot += SPAWN_W[i];
  var v = Math.random()*tot;
  for (i=0;i<SPAWN_W.length;i++){ v -= SPAWN_W[i]; if (v<0) return i; }
  return 0;
}

function Ball(t,x,y){
  this.t=t; this.x=x; this.y=y; this.vx=0; this.vy=0;
  this.r=RADII[t]; this.im=1/(this.r*this.r); this.age=0; this.m=false;
}

function reset(){
  balls.length=0; fx.length=0;
  score=0; overTimer=0; bannerT=0; gameOver=false; paused=false; bestTier=0;
  held=pick(); nextT=pick(); heldX=FIELD_W/2; cooldown=0;
}

function clampHeld(){
  if (held<0) return;
  var r=RADII[held];
  if (heldX<r) heldX=r;
  if (heldX>FIELD_W-r) heldX=FIELD_W-r;
}

function drop(){
  if (gameOver||paused||held<0) return;
  clampHeld();
  balls.push(new Ball(held, heldX, HELD_Y));
  held=-1; cooldown=DROP_DELAY;
}

/* ---------- 物理 ---------- */
function physics(dt){
  var n=balls.length; if (!n) return;
  var i,j,s,it,a,b;
  for (i=0;i<n;i++){ balls[i].age+=dt; balls[i].m=false; }
  var sub=dt/SUBSTEPS;

  for (s=0;s<SUBSTEPS;s++){
    for (i=0;i<n;i++){
      b=balls[i];
      b.vy += GRAVITY*sub; b.vx *= AIR; b.vy *= AIR;
      if (b.vx>MAXV) b.vx=MAXV; else if (b.vx<-MAXV) b.vx=-MAXV;
      if (b.vy>MAXV) b.vy=MAXV;
      b.x += b.vx*sub; b.y += b.vy*sub;
    }
    for (i=0;i<n;i++){
      b=balls[i]; var r=b.r;
      if (b.x-r<0){ b.x=r; if(b.vx<0) b.vx=-b.vx*WALL_REST; b.vy*=WALL_FRIC; }
      else if (b.x+r>FIELD_W){ b.x=FIELD_W-r; if(b.vx>0) b.vx=-b.vx*WALL_REST; b.vy*=WALL_FRIC; }
      if (b.y+r>FIELD_H){ b.y=FIELD_H-r; if(b.vy>0) b.vy=-b.vy*WALL_REST; b.vx*=WALL_FRIC; }
    }
    for (it=0; it<ITER; it++){
      for (i=0;i<n-1;i++){
        a=balls[i];
        for (j=i+1;j<n;j++){
          b=balls[j];
          var dx=b.x-a.x, dy=b.y-a.y, rs=a.r+b.r, d2=dx*dx+dy*dy;
          if (d2>=rs*rs) continue;
          if (d2<1e-9){ dx=0; dy=-1; d2=1; }
          var d=Math.sqrt(d2), nx=dx/d, ny=dy/d, ov=rs-d, tot=a.im+b.im;
          var corr=(ov/tot)*0.85;
          a.x-=nx*corr*a.im; a.y-=ny*corr*a.im;
          b.x+=nx*corr*b.im; b.y+=ny*corr*b.im;
          var rvx=b.vx-a.vx, rvy=b.vy-a.vy, vn=rvx*nx+rvy*ny;
          if (vn<0){
            var jn=-(1+REST)*vn/tot;
            a.vx-=nx*jn*a.im; a.vy-=ny*jn*a.im;
            b.vx+=nx*jn*b.im; b.vy+=ny*jn*b.im;
            var tx=-ny, ty=nx, vt=rvx*tx+rvy*ty, jt=-vt/tot*0.35;
            a.vx-=tx*jt*a.im; a.vy-=ty*jt*a.im;
            b.vx+=tx*jt*b.im; b.vy+=ty*jt*b.im;
          }
        }
      }
    }
    for (i=0;i<n-1;i++){
      a=balls[i]; if (a.m) continue;
      for (j=i+1;j<n;j++){
        b=balls[j]; if (b.m||a.t!==b.t) continue;
        var ddx=b.x-a.x, ddy=b.y-a.y, rr=a.r+b.r+0.75;
        if (ddx*ddx+ddy*ddy < rr*rr){ a.m=true; b.m=true; break; }
      }
    }
  }

  var merged=[];
  for (i=0;i<n;i++) if (balls[i].m) merged.push(balls[i]);
  if (merged.length) doMerges(merged);
}

function doMerges(m){
  m.sort(function(p,q){ return p.y-q.y; });
  var used=[], jobs=[], i, j;
  for (i=0;i<m.length;i++){
    if (used[i]) continue;
    var a=m[i], bj=-1, bd=1e18;
    for (j=0;j<m.length;j++){
      if (j===i||used[j]) continue;
      var b=m[j], dx=b.x-a.x, dy=b.y-a.y, dd=dx*dx+dy*dy;
      if (dd<bd){ bd=dd; bj=j; }
    }
    if (bj>=0){ used[i]=true; used[bj]=true; jobs.push([a,m[bj]]); }
  }
  for (i=0;i<jobs.length;i++){
    var p=jobs[i][0], q=jobs[i][1];
    var ia=balls.indexOf(p), ib=balls.indexOf(q);
    if (ia<0||ib<0) continue;
    balls.splice(ia,1);
    ib=balls.indexOf(q); if (ib>=0) balls.splice(ib,1);
    var t=Math.min(p.t+1, TIERS-1);
    var wa=p.r, wb=q.r;
    var mx=(p.x*wa+q.x*wb)/(wa+wb), my=(p.y*wa+q.y*wb)/(wa+wb);
    var nb=new Ball(t, mx, my);
    nb.vx=(p.vx+q.vx)*0.5; nb.vy=(p.vy+q.vy)*0.5-40;
    balls.push(nb);
    score += PTS[t];
    if (t>bestTier) bestTier=t;
    if (score>best){ best=score; saveBest(); }
    spawnFx(mx,my,t);
    onMergeSound(t);
    if (t>=TIERS-1){ bannerT=CELEBRATE; celebrate(); }
  }
}

function spawnFx(x,y,tier){
  var n = tier<6 ? 6 : 10;
  for (var i=0;i<n;i++){
    var an=Math.random()*Math.PI*2, sp=70+Math.random()*170;
    fx.push({x:x,y:y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-60,
             r0:3+Math.random()*4,r:0,life:0,ttl:0.30+Math.random()*0.25,c:COLORS[tier]});
  }
}

function celebrate(){
  for (var i=0;i<26;i++){
    var an=Math.random()*Math.PI*2, sp=120+Math.random()*300;
    fx.push({x:FIELD_W/2,y:FIELD_H/2,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,
             r0:4+Math.random()*6,r:0,life:0,ttl:0.5+Math.random()*0.5,
             c:COLORS[(Math.random()*COLORS.length)|0]});
  }
}

function stepWorld(dt){
  var i;
  for (i=fx.length-1;i>=0;i--){
    var f=fx[i]; f.life+=dt;
    if (f.life>=f.ttl){ fx.splice(i,1); continue; }
    f.vy += 1100*dt; f.x += f.vx*dt; f.y += f.vy*dt;
    f.r = f.r0*(1-f.life/f.ttl);
  }
  if (bannerT>0) bannerT=Math.max(0,bannerT-dt);
  if (paused||gameOver) return;

  if (held<0){
    cooldown -= dt;
    if (cooldown<=0){ cooldown=0; held=nextT; nextT=pick(); }
  }
  physics(dt);

  var danger=false;
  for (i=0;i<balls.length;i++){
    var b=balls[i];
    if (b.age>1.0 && (b.y-b.r)<DEATH_Y){ danger=true; break; }
  }
  if (danger) overTimer += dt; else overTimer = Math.max(0, overTimer-dt*1.6);
  if (overTimer>=DANGER_LIMIT){ gameOver=true; saveBest(); }
}

/* ============================ 绘制 ============================ */
function rr(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function drawBg(){
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#FFF3F8'); g.addColorStop(1,'#E4E8FC');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  var x0=sx(0), y0=sy(0), x1=sx(FIELD_W), y1=sy(FIELD_H);
  ctx.save();
  ctx.shadowColor='rgba(110,100,165,0.16)'; ctx.shadowBlur=18*L.s; ctx.shadowOffsetY=6*L.s;
  rr(x0,y0,x1-x0,y1-y0, 34*L.s);
  ctx.fillStyle='rgba(255,255,255,0.56)'; ctx.fill();
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,0.75)'; ctx.lineWidth=Math.max(1.5,4*L.s);
  rr(x0,y0,x1-x0,y1-y0, 34*L.s); ctx.stroke();
}

function drawDeath(){
  var k=Math.min(1, overTimer/DANGER_LIMIT);
  var r=Math.round(221+(233-221)*k), g=Math.round(210+(74-210)*k), b=Math.round(236+(128-236)*k);
  ctx.strokeStyle='rgb('+r+','+g+','+b+')';
  ctx.lineWidth=Math.max(1.5, (k>0.5?3:2)*L.s);
  if (ctx.setLineDash) ctx.setLineDash([7*L.s,7*L.s]);
  ctx.beginPath(); ctx.moveTo(sx(0),sy(DEATH_Y)); ctx.lineTo(sx(FIELD_W),sy(DEATH_Y)); ctx.stroke();
  if (ctx.setLineDash) ctx.setLineDash([]);
}

function drawGuide(){
  if (held<0||gameOver) return;
  clampHeld();
  var x=sx(heldX);
  ctx.strokeStyle='rgba(185,173,212,0.75)';
  ctx.lineWidth=Math.max(1,2*L.s);
  if (ctx.setLineDash) ctx.setLineDash([5*L.s,9*L.s]);
  ctx.beginPath(); ctx.moveTo(x, sy(HELD_Y+RADII[held]*0.4)); ctx.lineTo(x, sy(FIELD_H)); ctx.stroke();
  if (ctx.setLineDash) ctx.setLineDash([]);
}

function drawBalls(){
  for (var i=0;i<balls.length;i++){
    var b=balls[i], im=sprites[b.t];
    if (!im||!im.complete) continue;
    var d=sd(b.r);
    ctx.drawImage(im, sx(b.x)-d, sy(b.y)-d, d*2, d*2);
  }
}

function drawHeld(){
  if (held<0||gameOver) return;
  var im=sprites[held]; if (!im||!im.complete) return;
  clampHeld();
  var d=sd(RADII[held]);
  ctx.drawImage(im, sx(heldX)-d, sy(HELD_Y)-d, d*2, d*2);
}

function drawFx(){
  for (var i=0;i<fx.length;i++){
    var f=fx[i];
    ctx.fillStyle=f.c;
    ctx.beginPath(); ctx.arc(sx(f.x), sy(f.y), Math.max(0.6, sd(f.r)), 0, Math.PI*2); ctx.fill();
  }
}

function setFont(size,bold){
  ctx.font=(bold?'bold ':'')+Math.max(8,Math.round(size))+'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
}
function txt(s,x,y,size,color,bold,align){
  ctx.fillStyle=color;
  ctx.textAlign=align||'left';
  ctx.textBaseline='alphabetic';
  setFont(size,bold);
  ctx.fillText(s,x,y);
}

function drawHudPortrait(){
  var pad=W*0.05;
  var ls=Math.max(10,L.hudH*0.19), vs=Math.max(18,L.hudH*0.46);
  txt('得分', pad, L.hudH*0.30, ls, INK2, false, 'left');
  txt(String(score), pad, L.hudH*0.86, vs, INK, true, 'left');
  txt('最高分', W-pad, L.hudH*0.30, ls*0.92, INK2, false, 'right');
  txt(String(best), W-pad, L.hudH*0.86, vs*0.62, INK2, true, 'right');

  var cx=W*0.5, cy=L.hudH*0.46;
  var im=sprites[nextT];
  if (im && im.complete){
    var maxR=L.hudH*0.34;
    var r=Math.min(maxR, im.width/2*0.5 + maxR*0.5);
    r=Math.min(maxR, Math.max(L.hudH*0.18, im.width*0.16));
    ctx.drawImage(im, cx-r, cy-r, r*2, r*2);
  }
  txt(NAMES[nextT], cx, L.hudH*0.98, Math.max(9,L.hudH*0.17), INK2, false, 'center');
}

function drawPanel(){
  var P=L.panel; if (!P) return;
  var u = Math.min(P.w/13.5, P.h/17);          /* 版式基准单位 */
  var pad = Math.max(8, u*0.78);

  /* 标题 */
  var tf = Math.max(13, u*1.20);
  setFont(tf, true);
  var w1 = ctx.measureText('合成').width;
  txt('合成', P.x, P.y+u*1.25, tf, INK, true, 'left');
  txt('姚美玲', P.x+w1, P.y+u*1.25, tf, PINK, true, 'left');
  txt('MERGE YAO MEILING', P.x, P.y+u*1.95, Math.max(7,u*0.44), INK2, false, 'left');

  /* 得分 / 下一个 / 最高分 —— 并成一栏三格，省下高度给图鉴 */
  var sy0 = P.y + u*2.35, sh = u*3.6;
  ctx.fillStyle='rgba(255,255,255,0.93)';
  rr(P.x, sy0, P.w, sh, u*0.7); ctx.fill();
  var colW = P.w/3;
  var c1 = P.x+colW*0.5, c2 = P.x+colW*1.5, c3 = P.x+colW*2.5;
  var lb = Math.max(8, u*0.52);
  txt('得分',   c1, sy0+sh*0.30, lb,      INK2, false, 'center');
  txt(String(score), c1, sy0+sh*0.82, Math.max(14,u*1.35), INK, true, 'center');
  txt('下一个', c2, sy0+sh*0.30, lb,      INK2, false, 'center');
  txt('最高分', c3, sy0+sh*0.30, lb,      INK2, false, 'center');
  txt(String(best),  c3, sy0+sh*0.82, Math.max(12,u*1.10), INK2, true, 'center');
  var im=sprites[nextT];
  if (im&&im.complete){
    var r=Math.min(sh*0.21, colW*0.24);
    ctx.drawImage(im, c2-r, sy0+sh*0.54-r, r*2, r*2);
    txt(NAMES[nextT], c2, sy0+sh*0.90, Math.max(8,u*0.48), '#5B5278', true, 'center');
  }

  /* 进化图鉴 */
  var ey = sy0 + sh + u*0.7;
  var eh = P.y + P.h - ey;
  if (eh < u*3) return;
  ctx.fillStyle='rgba(255,255,255,0.93)';
  rr(P.x, ey, P.w, eh, u*0.7); ctx.fill();
  var hdr = Math.max(9, u*0.54);
  txt('美玲进化图鉴', P.x+pad, ey+hdr*1.6, hdr, INK2, false, 'left');
  txt('分数', P.x+P.w-pad, ey+hdr*1.6, hdr*0.9, INK2, false, 'right');
  var top = ey + hdr*2.4;
  var rowH = (P.y+P.h-top-pad)/TIERS;
  var br = Math.max(4, Math.min(rowH*0.40, pad*1.5));
  for (var i=0;i<TIERS;i++){
    var yy = top + rowH*(i+0.5);
    ctx.globalAlpha = (i<=bestTier)?1:0.26;
    ctx.fillStyle = COLORS[i];
    ctx.beginPath(); ctx.arc(P.x+pad+br, yy, br, 0, Math.PI*2); ctx.fill();
    var mi = sprites[i];
    if (mi&&mi.complete) ctx.drawImage(mi, P.x+pad+br*0.16, yy-br*0.84, br*1.68, br*1.68);
    ctx.globalAlpha = 1;
    var fs = Math.max(8, Math.min(rowH*0.70, u*0.56));
    txt(NAMES[i], P.x+pad+br*2.5, yy+fs*0.36, fs, INK, false, 'left');
    txt(i?('+'+PTS[i]):'-', P.x+P.w-pad, yy+fs*0.36, fs*0.92, INK2, false, 'right');
  }
}

function drawStripPortrait(){
  var pad=W*0.055, usable=W-pad*2, step=usable/(TIERS-1);
  var cy=H-L.stripH*0.52;
  for (var i=0;i<TIERS;i++){
    var im=sprites[i]; if (!im||!im.complete) continue;
    var r=L.stripH*(0.16+0.30*i/(TIERS-1));
    var x=pad+step*i;
    ctx.globalAlpha=(i<=bestTier)?1:0.24;
    ctx.drawImage(im, x-r, cy-r, r*2, r*2);
  }
  ctx.globalAlpha=1;
}

function drawOverlay(){
  if (!started){
    var fx0=sx(0), fy0=sy(0), fx1=sx(FIELD_W), fy1=sy(FIELD_H);
    ctx.fillStyle='rgba(42,33,64,0.62)';
    ctx.fillRect(0,0,W,H);
    var cx=(fx0+fx1)/2, cy=(fy0+fy1)/2;
    var base=Math.min(fx1-fx0, fy1-fy0);       /* 一律按罐子尺寸算，横竖屏都合适 */
    var t1=Math.max(20, base*0.115), t2=Math.max(11, base*0.048);
    txt('合成姚美玲', cx, cy-base*0.16, t1, '#FFFFFF', true, 'center');
    txt('合成大西瓜玩法', cx, cy-base*0.075, t2, '#E6DEF6', false, 'center');
    var bw=Math.min(base*0.80, 360), bh=Math.max(42, base*0.135);
    ctx.fillStyle=PINK;
    rr(cx-bw/2, cy, bw, bh, bh/2); ctx.fill();
    txt('点 击 开 始', cx, cy+bh*0.68, Math.max(14,bh*0.40), '#FFFFFF', true, 'center');
    txt('按住左右拖动瞄准，松手投放', cx, cy+bh+base*0.11, Math.max(10,base*0.046), '#EDE7FA', false, 'center');
    return;
  }
  if (!gameOver) return;
  var x0=sx(0), y0=sy(0), x1=sx(FIELD_W), y1=sy(FIELD_H);
  ctx.fillStyle='rgba(42,33,64,0.72)';
  rr(x0,y0,x1-x0,y1-y0,34*L.s); ctx.fill();
  var cx=(x0+x1)/2, cy=(y0+y1)/2;
  txt('游戏结束', cx, cy-sd(96), Math.max(20,sd(32)), '#FFFFFF', true, 'center');
  txt('本局得分  '+score, cx, cy-sd(24), Math.max(14,sd(19)), GOLD, true, 'center');
  txt((score>=best&&score>0)?'新纪录！':('最高分  '+best), cx, cy+sd(26), Math.max(11,sd(13)), '#DCD4F0', false, 'center');
  var bw=sx(FIELD_W)*0.56, bh=sd(58);
  ctx.fillStyle=PINK;
  rr(cx-bw/2, cy+sd(55), bw, bh, bh/2); ctx.fill();
  txt('再来一局', cx, cy+sd(55)+bh*0.66, Math.max(13,bh*0.40), '#FFFFFF', true, 'center');
}

function drawBanner(){
  if (bannerT<=0) return;
  var k=bannerT/CELEBRATE, grow=Math.min(1,(1-k)*6);
  var size=sd(20+14*grow*(0.55+0.45*k));
  var x=sx(FIELD_W/2), y=sy(FIELD_H*0.45);
  txt('★  合成姚美玲！  ★', x+2, y+2, size, 'rgba(255,255,255,0.45)', true, 'center');
  txt('★  合成姚美玲！  ★', x, y, size, PINK, true, 'center');
}

function render(){
  drawBg();
  drawDeath();
  drawGuide();
  drawBalls();
  drawFx();
  drawHeld();
  if (L.portrait){ drawHudPortrait(); } else { drawPanel(); }
  drawBanner();
  drawOverlay();
  if (L.portrait) drawStripPortrait();
}

/* ============================ 输入 ============================ */
var dragging=false;

function toVirtualX(clientX){
  var rect = cv.getBoundingClientRect();
  return ((clientX - rect.left) - L.fl)/L.s;
}

function hitRestart(clientX, clientY){
  var x0=sx(0), y0=sy(0), x1=sx(FIELD_W), y1=sy(FIELD_H);
  var cx=(x0+x1)/2, cy=(y0+y1)/2;
  var bw=(x1-x0)*0.56, bh=sd(58);
  return clientX>=cx-bw/2 && clientX<=cx+bw/2 && clientY>=cy+sd(55) && clientY<=cy+sd(55)+bh;
}

function onDown(e){
  var t = e.touches ? e.touches[0] : e;
  if (!started){
    initAudio();
    started = true;
    reset();
    return;
  }
  if (gameOver){
    if (hitRestart(t.clientX, t.clientY)) { reset(); }
    return;
  }
  dragging = true;
  heldX = toVirtualX(t.clientX);
  clampHeld();
}

function onMove(e){
  if (!dragging || gameOver) return;
  var t = e.touches ? e.touches[0] : e;
  heldX = toVirtualX(t.clientX);
  clampHeld();
  if (e.cancelable) e.preventDefault();
}

function onUp(e){
  if (!started || gameOver) { dragging=false; return; }
  if (!dragging) return;
  dragging = false;
  var t = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : e;
  heldX = toVirtualX(t.clientX);
  clampHeld();
  drop();
}

cv.addEventListener('touchstart', onDown, {passive:true});
cv.addEventListener('touchmove', onMove, {passive:false});
cv.addEventListener('touchend', onUp, {passive:true});
cv.addEventListener('touchcancel', function(){ dragging=false; }, {passive:true});
cv.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);

/* 微信：桥就绪后解锁一次音频 */
document.addEventListener('WeixinJSBridgeReady', function(){ initAudio(); }, false);
document.addEventListener('touchstart', function once(){
  initAudio(); document.removeEventListener('touchstart', once, false);
}, {passive:true});

/* ============================ 主循环 ============================ */
var lastT = 0;
function frame(ts){
  if (!lastT) lastT = ts;
  var dt = (ts-lastT)/1000;
  lastT = ts;
  if (dt>0.05) dt=0.05;
  if (dt<0) dt=0;
  if (started) stepWorld(dt);
  render();
  requestAnimationFrame(frame);
}

window.addEventListener('resize', function(){ setTimeout(resize,60); });
window.addEventListener('orientationchange', function(){ setTimeout(resize,200); });
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

loadBest();
resize();
reset();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
